  <noscript>Esta aplicación necesita JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
  <script>
    // Aplicación instalable: registra el service worker y guarda el aviso de instalación
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__instalar = e; dispatchEvent(new Event('instalable')); });
    addEventListener('appinstalled', () => { window.__instalar = null; dispatchEvent(new Event('instalable')); });
  </script>
</body>
